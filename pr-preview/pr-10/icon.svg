<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12203a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.44" r="0.6">
      <stop offset="0" stop-color="#37d67a" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#37d67a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#37d67a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ball" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#e7b077"/>
      <stop offset="0.55" stop-color="#c07d3f"/>
      <stop offset="1" stop-color="#9a5a24"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" fill="url(#glow)"/>

  <!-- football -->
  <g transform="rotate(-20 256 256)">
    <!-- soft shadow -->
    <ellipse cx="256" cy="268" rx="150" ry="94" fill="#000000" opacity="0.30"/>
    <!-- body -->
    <ellipse cx="256" cy="256" rx="150" ry="94" fill="url(#ball)" stroke="#5f3714" stroke-width="6"/>
    <!-- top sheen -->
    <ellipse cx="226" cy="224" rx="92" ry="38" fill="#ffffff" opacity="0.13"/>
    <!-- end stripes -->
    <path d="M 360 214 A 94 94 0 0 1 360 298" fill="none" stroke="#f4ead9" stroke-width="12" stroke-linecap="round"/>
    <path d="M 152 214 A 94 94 0 0 0 152 298" fill="none" stroke="#f4ead9" stroke-width="12" stroke-linecap="round"/>
    <!-- laces: dark underlay then bright green -->
    <g stroke-linecap="round">
      <line x1="198" y1="256" x2="314" y2="256" stroke="#123a22" stroke-width="16"/>
      <g stroke="#123a22" stroke-width="16">
        <line x1="216" y1="234" x2="216" y2="278"/>
        <line x1="240" y1="232" x2="240" y2="280"/>
        <line x1="264" y1="232" x2="264" y2="280"/>
        <line x1="288" y1="234" x2="288" y2="278"/>
      </g>
      <line x1="198" y1="256" x2="314" y2="256" stroke="#3ee27f" stroke-width="9"/>
      <g stroke="#3ee27f" stroke-width="9">
        <line x1="216" y1="236" x2="216" y2="276"/>
        <line x1="240" y1="234" x2="240" y2="278"/>
        <line x1="264" y1="234" x2="264" y2="278"/>
        <line x1="288" y1="236" x2="288" y2="276"/>
      </g>
    </g>
  </g>
</svg>
