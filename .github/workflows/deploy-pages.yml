name: Deploy web preview to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Publishing to the gh-pages branch needs write access to repo contents.
permissions:
  contents: write

# One production deploy at a time; don't cancel an in-progress deploy.
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        # EXPO_BASE_URL makes assets resolve under the project-page subpath.
        # EXPO_PUBLIC_SUPABASE_* enable cloud sync (public values; set as repo
        # Actions Variables). Absent -> the app runs local-only.
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: bash scripts/build-web.sh

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Publish the app at the branch root, but keep the pr-preview/ folder
          # (managed by the PR-preview workflow) so open previews survive a
          # production deploy.
          keep_files: true
