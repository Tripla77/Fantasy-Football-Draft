name: PR preview

# Deploy each pull request to its own subfolder of the gh-pages site so it can
# be viewed (and installed as a PWA) at a URL distinct from production, then
# clean it up when the PR closes.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write # push the preview to the gh-pages branch
  pull-requests: write # comment the preview URL on the PR

# One preview build per PR; newer pushes supersede older ones.
concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Fork PRs can't get a write token or secrets, so skip them (they'd fail).
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      - name: Build web app
        if: github.event.action != 'closed'
        # Assets must resolve under the preview subpath.
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}
        run: bash scripts/build-web.sh

      - name: Deploy / update / remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
